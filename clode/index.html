<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0f1a">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="clode">
<meta name="referrer" content="no-referrer">
<title>clode</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #0b0f1a; --panel: #121829; --panel-2: #1a2238; --line: #263049; --text: #e6e9f2; --muted: #8b95b0; --dim: #5d678a;
  --accent: #818cf8; --accent-ink: #0b0f1a; --teal: #2dd4bf; --ok: #22c55e; --bad: #ef4444; --warn: #f59e0b; --info: #60a5fa;
  --add: #16a34a; --add-bg: rgba(34,197,94,.12); --del: #dc2626; --del-bg: rgba(239,68,68,.12);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --radius: 14px;
}
@media (prefers-color-scheme: light) { :root { --bg: #f4f6fb; --panel: #fff; --panel-2: #eceff7; --line: #d8dded; --text: #0f172a; --muted: #5d678a; --dim: #8b95b0; --accent: #4f46e5; --accent-ink: #fff; --add-bg: rgba(22,163,74,.1); --del-bg: rgba(220,38,38,.1); } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; overscroll-behavior-y: none; }
body { display: flex; flex-direction: column; height: 100dvh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--info); }
textarea, input, select { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.top { display: flex; align-items: center; gap: 10px; padding: calc(var(--sat) + 10px) 14px 10px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.top h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.top .sub { font-size: 12px; color: var(--muted); font-weight: 400; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.run { background: var(--accent); animation: pulse 1.1s infinite; } .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
.iconbtn { min-width: 38px; height: 38px; padding: 0 8px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 18px; flex: none; }
.iconbtn:active { background: var(--panel-2); }
.iconbtn .n { position: absolute; transform: translate(14px, -12px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--teal); color: var(--accent-ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px calc(var(--sab) + 20px); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
.card.tap:active { background: var(--panel-2); }
.card .k { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
.card .k .kind { font-weight: 700; color: var(--accent); }
.card .title { font-weight: 600; font-size: 15px; word-break: break-word; }
.card .desc { color: var(--muted); font-size: 14px; margin-top: 4px; word-break: break-word; }
pre.cmd { margin: 8px 0 0; padding: 10px 12px; background: var(--panel-2); border-radius: 10px; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
.row { display: flex; gap: 8px; margin-top: 10px; }
.btn { flex: 1; padding: 11px 10px; border-radius: 11px; background: var(--panel-2); font-weight: 600; font-size: 14px; text-align: center; border: 1px solid var(--line); }
.btn:active { filter: brightness(1.15); } .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; } .btn.danger { color: var(--bad); } .btn.ghost { background: transparent; } .btn[disabled] { opacity: .5; }
.empty { text-align: center; color: var(--muted); padding: 50px 20px; }
.empty .big { font-size: 42px; margin-bottom: 8px; }
.list .item { display: flex; align-items: center; gap: 12px; }
.list .item .body { flex: 1; min-width: 0; } .list .item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; white-space: nowrap; overflow: hidden; }
.add { color: var(--add); } .del { color: var(--del); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
.msgs { display: flex; flex-direction: column; gap: 10px; }
.msg.user { align-self: flex-end; max-width: 88%; background: var(--panel-2); border-radius: 16px 16px 4px 16px; padding: 9px 13px; white-space: pre-wrap; word-break: break-word; }
.msg.assistant { display: flex; flex-direction: column; gap: 8px; }
.md { word-break: break-word; } .md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
.md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 13px; margin: 8px 0; }
.md code { font-family: var(--mono); font-size: 13px; background: var(--panel-2); padding: 1px 5px; border-radius: 5px; } .md pre code { background: none; padding: 0; }
.md ul, .md ol { margin: 4px 0 8px; padding-left: 22px; } .md h3 { font-size: 15px; margin: 10px 0 6px; }
.tool { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tool .hd { display: flex; align-items: center; gap: 8px; padding: 9px 12px; font-size: 13px; }
.tool .hd .name { font-family: var(--mono); color: var(--muted); flex: none; } .tool .hd .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .hd .stt { flex: none; font-size: 11px; padding: 2px 7px; border-radius: 8px; background: var(--panel-2); color: var(--muted); }
.tool .hd .stt.running { color: var(--accent); } .tool .hd .stt.error { color: var(--bad); } .tool .hd .stt.done { color: var(--ok); } .tool .hd .stt.denied { color: var(--warn); }
.tool .bd { border-top: 1px solid var(--line); padding: 8px 12px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; color: var(--muted); }
.tool .bd b { color: var(--text); font-weight: 600; }
.think { color: var(--muted); font-size: 13px; } .think summary { cursor: pointer; } .think .bd { white-space: pre-wrap; margin-top: 6px; }
.diff { font-family: var(--mono); font-size: 12px; white-space: pre; overflow-x: auto; line-height: 1.5; }
.diff .l { padding: 0 8px; } .diff .l.a { background: var(--add-bg); color: var(--add); } .diff .l.d { background: var(--del-bg); color: var(--del); } .diff .l.h { color: var(--info); }
.composer { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 10px calc(var(--sab) + 8px); }
.composer .in { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 42px; max-height: 160px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); outline: none; font-size: 16px; line-height: 1.35; }
.composer .send { width: 44px; height: 42px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 20px; display: grid; place-items: center; flex: none; }
.composer .send.stop { background: var(--bad); color: #fff; }
.hint { font-size: 11px; color: var(--dim); margin-top: 4px; display: flex; justify-content: space-between; }
.toast { position: fixed; left: 50%; bottom: calc(var(--sab) + 80px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: 90vw; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88dvh; background: var(--panel); border-radius: 18px 18px 0 0; z-index: 21; display: flex; flex-direction: column; padding-bottom: var(--sab); }
.sheet .hd { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; gap: 8px; } .sheet .hd .x { margin-left: auto; }
.sheet .bd { overflow: auto; padding: 8px 0; }
.file { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.file .fn { display: flex; gap: 10px; font-family: var(--mono); font-size: 13px; } .file .fn .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.form label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
.form input[type=text], .form input[type=password], .form select, .form textarea { width: 100%; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.form .help { font-size: 13px; color: var(--muted); margin-top: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; margin-top: 8px; }
.opt.on { border-color: var(--accent); background: var(--panel-2); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; } .kv:last-child { border-bottom: 0; } .kv .v { color: var(--muted); text-align: right; word-break: break-all; }
.section { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 4px 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 28px; height: 28px; border-radius: 8px; }
.small { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 9px; background: var(--panel-2); font-size: 12px; color: var(--muted); }
details.adv summary { color: var(--muted); font-size: 13px; cursor: pointer; margin-top: 14px; }
.fab { position: fixed; right: 16px; bottom: calc(var(--sab) + 16px); width: 54px; height: 54px; border-radius: 27px; background: var(--accent); color: var(--accent-ink); font-size: 26px; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 6; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
